<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Alma Mater Studiorum - Università di Bologna Seal -->
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#8B1A2B" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#8B1A2B" stroke-width="1.5"/>
  <!-- Inner fill -->
  <circle cx="100" cy="100" r="86" fill="#8B1A2B"/>
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#D4A574" stroke-width="1"/>
  <!-- Central figure - Scholar/Teacher -->
  <g fill="#D4A574" stroke="#D4A574" stroke-width="0.5">
    <!-- Lectern/Desk -->
    <rect x="65" y="105" width="70" height="6" rx="2"/>
    <rect x="70" y="111" width="8" height="25" rx="1"/>
    <rect x="122" y="111" width="8" height="25" rx="1"/>
    <rect x="62" y="133" width="76" height="4" rx="1"/>
    <!-- Book on lectern -->
    <rect x="78" y="96" width="44" height="10" rx="2" fill="none" stroke="#D4A574" stroke-width="1.5"/>
    <line x1="100" y1="96" x2="100" y2="106" stroke="#D4A574" stroke-width="0.8"/>
    <!-- Central figure (teacher) -->
    <circle cx="100" cy="62" r="10" fill="none" stroke="#D4A574" stroke-width="1.5"/>
    <path d="M90 72 Q100 80 110 72 L115 95 L85 95 Z" fill="none" stroke="#D4A574" stroke-width="1.2"/>
    <!-- Students left -->
    <circle cx="72" cy="78" r="6" fill="none" stroke="#D4A574" stroke-width="1"/>
    <path d="M66 84 Q72 88 78 84 L80 95 L64 95 Z" fill="none" stroke="#D4A574" stroke-width="0.8"/>
    <!-- Students right -->
    <circle cx="128" cy="78" r="6" fill="none" stroke="#D4A574" stroke-width="1"/>
    <path d="M122 84 Q128 88 134 84 L136 95 L120 95 Z" fill="none" stroke="#D4A574" stroke-width="0.8"/>
  </g>
  <!-- Text around the seal -->
  <defs>
    <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100"/>
    <path id="bottomArc" d="M 170,108 A 70,70 0 0,1 30,108"/>
  </defs>
  <text fill="#D4A574" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="2.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ALMA MATER STUDIORUM</textPath>
  </text>
  <text fill="#D4A574" font-family="Georgia, serif" font-size="7.5" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">A.D. MCLXXXVIII</textPath>
  </text>
  <!-- Decorative dots -->
  <circle cx="30" cy="100" r="2" fill="#D4A574"/>
  <circle cx="170" cy="100" r="2" fill="#D4A574"/>
</svg>
