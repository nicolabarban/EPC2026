<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none">
  <!-- Background arches -->
  <path d="M260 20 C380 20 460 120 460 260 L460 470 L60 470 L60 260 C60 120 140 20 260 20Z" fill="none" stroke="#E8DDD4" stroke-width="2"/>
  <path d="M260 40 C370 40 440 130 440 260 L440 470 L80 470 L80 260 C80 130 150 40 260 40Z" fill="none" stroke="#DDD0C4" stroke-width="1.5"/>
  <!-- Main arch with scene -->
  <clipPath id="arch">
    <path d="M260 60 C360 60 420 140 420 260 L420 470 L100 470 L100 260 C100 140 160 60 260 60Z"/>
  </clipPath>
  <g clip-path="url(#arch)">
    <!-- Sky / background -->
    <rect x="100" y="60" width="320" height="410" fill="#7B2D3B"/>
    <!-- Distant buildings silhouette -->
    <rect x="110" y="280" width="40" height="190" fill="#6B2333" rx="2"/>
    <rect x="155" y="300" width="35" height="170" fill="#5B1A2A" rx="2"/>
    <rect x="195" y="260" width="30" height="210" fill="#6B2333" rx="2"/>
    <!-- Church dome -->
    <ellipse cx="165" cy="270" rx="30" ry="20" fill="#8B4050"/>
    <rect x="160" y="240" width="10" height="30" fill="#8B4050" rx="2"/>
    <circle cx="165" cy="238" r="4" fill="#C47A5A"/>
    <!-- Asinelli Tower (tall) -->
    <rect x="240" y="100" width="40" height="370" fill="#C47A5A" rx="2"/>
    <rect x="238" y="95" width="44" height="15" fill="#B06A4A" rx="2"/>
    <rect x="244" y="80" width="8" height="20" fill="#A05A3A"/>
    <polygon points="248,70 252,70 250,60" fill="#6B2333"/>
    <!-- Asinelli windows -->
    <rect x="250" y="130" width="8" height="12" rx="1" fill="#8B4050" opacity=".5"/>
    <rect x="250" y="160" width="8" height="12" rx="1" fill="#8B4050" opacity=".5"/>
    <rect x="250" y="190" width="8" height="12" rx="1" fill="#8B4050" opacity=".5"/>
    <rect x="250" y="220" width="8" height="12" rx="1" fill="#8B4050" opacity=".5"/>
    <rect x="250" y="250" width="8" height="12" rx="1" fill="#8B4050" opacity=".5"/>
    <!-- Garisenda Tower (shorter, leaning) -->
    <g transform="rotate(-1.5, 200, 470)">
      <rect x="195" y="200" width="35" height="270" fill="#A05A3A" rx="2"/>
      <rect x="193" y="195" width="39" height="12" fill="#8B4A3A" rx="2"/>
    </g>
    <!-- Foreground buildings -->
    <rect x="100" y="340" width="55" height="130" fill="#8B3A3A" rx="2"/>
    <rect x="108" y="350" width="12" height="16" rx="1" fill="#6B2333"/>
    <rect x="128" y="350" width="12" height="16" rx="1" fill="#6B2333"/>
    <rect x="108" y="380" width="12" height="16" rx="1" fill="#6B2333"/>
    <rect x="128" y="380" width="12" height="16" rx="1" fill="#6B2333"/>
    <rect x="290" y="320" width="50" height="150" fill="#9B4A4A" rx="2"/>
    <rect x="298" y="335" width="10" height="14" rx="1" fill="#7B2D3B"/>
    <rect x="316" y="335" width="10" height="14" rx="1" fill="#7B2D3B"/>
    <rect x="298" y="360" width="10" height="14" rx="1" fill="#7B2D3B"/>
    <rect x="345" y="350" width="45" height="120" fill="#8B3A3A" rx="2"/>
    <polygon points="345,350 367,330 390,350" fill="#6B2333"/>
    <rect x="350" y="360" width="10" height="14" rx="1" fill="#6B2333"/>
    <rect x="375" y="360" width="10" height="14" rx="1" fill="#6B2333"/>
    <!-- Roof details -->
    <polygon points="100,340 155,310 155,340" fill="#6B2333"/>
    <polygon points="290,320 315,295 340,320" fill="#7B2D3B"/>
  </g>
  <!-- Arch border -->
  <path d="M260 60 C360 60 420 140 420 260 L420 470 L100 470 L100 260 C100 140 160 60 260 60Z" fill="none" stroke="#E8DDD4" stroke-width="3"/>
</svg>
